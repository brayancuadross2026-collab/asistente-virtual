<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" role="img" aria-label="La Brasa Dorada">
  <defs>
    <linearGradient id="oro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c988"/>
      <stop offset="55%" stop-color="#d4a24e"/>
      <stop offset="100%" stop-color="#b8842f"/>
    </linearGradient>
    <linearGradient id="fuego" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#C0392B"/>
      <stop offset="55%" stop-color="#E67E22"/>
      <stop offset="100%" stop-color="#f7c948"/>
    </linearGradient>
    <radialGradient id="ascua" cx="50%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#ffb347" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- marca: parrilla con llama -->
  <g transform="translate(6,6)">
    <circle cx="42" cy="42" r="41" fill="none" stroke="url(#oro)" stroke-width="2"/>
    <circle cx="42" cy="52" r="30" fill="url(#ascua)"/>

    <!-- llama -->
    <path d="M42 14c6 9 3 13 7 18 3 4 8 5 8 13 0 9-7 16-15 16s-15-7-15-16c0-7 4-10 6-15 1-3 2-6 1-9 4 2 6 5 7 8 2-5 2-10 1-15z"
          fill="url(#fuego)"/>
    <path d="M42 34c3 5 1 7 3 10 2 2 4 3 4 7 0 5-3 8-7 8s-7-3-7-8c0-4 2-5 3-8 1-2 1-4 1-6 2 1 2 3 3 4z"
          fill="#ffe08a" opacity=".85"/>

    <!-- barras de la parrilla -->
    <g stroke="url(#oro)" stroke-width="3" stroke-linecap="round">
      <line x1="18" y1="66" x2="66" y2="66"/>
      <line x1="22" y1="73" x2="62" y2="73"/>
    </g>
  </g>

  <!-- nombre -->
  <g transform="translate(104,0)">
    <text x="0" y="44" font-family="Playfair Display, Georgia, 'Times New Roman', serif"
          font-size="31" font-weight="700" letter-spacing="1.5" fill="#ffffff">LA BRASA</text>
    <text x="0" y="76" font-family="Playfair Display, Georgia, 'Times New Roman', serif"
          font-size="31" font-weight="700" font-style="italic" letter-spacing="1.5" fill="url(#oro)">DORADA</text>
    <line x1="1" y1="55" x2="196" y2="55" stroke="url(#oro)" stroke-width="1" opacity=".45"/>
  </g>
</svg>
